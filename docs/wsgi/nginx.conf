error_log  /home/user/src/milahu/opensubtitles-scraper/docs/wsgi/nginx.error.log notice;
pid        /home/user/src/milahu/opensubtitles-scraper/docs/wsgi/nginx.pid;

events { }

http {

    upstream subtitles-server {
        # use the get-subs.py script's "def application" as the WSGI request handler
        # gunicorn --preload --workers 4 --bind unix:/run/get-subs.sock get-subs:application
        # server unix:/run/get-subs.sock fail_timeout=0;
        server unix:/home/user/src/milahu/opensubtitles-scraper/docs/wsgi/get-subs.sock fail_timeout=0;

        # gunicorn --preload --workers 4 --bind 127.0.0.1:8234 get-subs:application
        # server 127.0.0.1:8234 fail_timeout=0;
    }

    server {

        listen 9592;
        # server_name example.com www.example.com;

        access_log /home/user/src/milahu/opensubtitles-scraper/docs/wsgi/nginx.access.log;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

        # Hide server information
        server_tokens off;

        # Client settings
        client_max_body_size 10M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        location /bin/get-subtitles {
            proxy_set_header   Host               $host;
            proxy_set_header   X-Forwarded-Host   $http_x_host;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Request-URI      $request_uri;
            proxy_set_header   X-Forwarded-URI    $request_uri;

            proxy_redirect off;
            proxy_buffering off;

            # upstream subtitles-server { ... }
            proxy_pass http://subtitles-server;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

    }

}
